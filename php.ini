; PHP Configuration for Newznab-tmux
; Newznab-specific settings only - defaults loaded automatically

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 100M
post_max_size = 100M
expose_php = Off
log_errors = On
error_log = /dev/stderr
display_errors = Off
session.save_path = "/tmp"
session.gc_maxlifetime = 86400
date.timezone = UTC
