; PHP Configuration for Newznab-tmux

; Limits
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 100M
post_max_size = 100M

; PHP-FPM settings
expose_php = Off
log_errors = On
error_log = /dev/stderr
display_errors = Off

; Security
disable_functions = passthru,shell_exec,system,proc_open,proc_close,exec,popen,pclose

; Session
session.save_path = "/tmp"
session.gc_maxlifetime = 86400

; Database
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; Date/Time
date.timezone = UTC
