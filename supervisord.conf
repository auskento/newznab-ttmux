[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
childlogdir=/var/log/supervisor
silent=false
loglevel=debug

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; Infrastructure Services
; ============================================================================

[program:mariadb]
command=/usr/sbin/mysqld --user=mysql --datadir=/data/mysql --bind-address=127.0.0.1 --port=3306
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=5
priority=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mariadb.log

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --dbfilename dump.rdb --appendonly yes --appendfsync everysec
autostart=true
autorestart=true
startsecs=10
priority=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis.log
user=redis
startretries=5

[program:meilisearch]
command=/usr/local/bin/meilisearch --db-path=/data/meilisearch --env=production --master-key %(ENV_MEILISEARCH_MASTER_KEY)s
autostart=true
autorestart=true
startsecs=15
priority=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/meilisearch.log
stderr_logfile=/var/log/supervisor/meilisearch-error.log
user=root
startretries=5
environment=MEILISEARCH_MASTER_KEY="changeme"

[program:php-fpm]
command=/usr/sbin/php-fpm8.4 -F -R
autostart=true
autorestart=true
startsecs=15
priority=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log
user=www-data
startretries=5

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=15
priority=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
startretries=5

; ============================================================================
; Application Services
; ============================================================================

; Laravel queue workers - adjust numprocs based on CPU cores
[program:newznab-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/newznab/artisan queue:work --queue=default --tries=3 --timeout=3600
directory=/var/www/newznab
autostart=true
autorestart=true
numprocs=2
priority=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
user=www-data
stopasgroup=true

[program:newznab-worker-releases]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/newznab/artisan queue:work --queue=releases --tries=3 --timeout=3600
directory=/var/www/newznab
autostart=true
autorestart=true
numprocs=2
priority=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-releases.log
user=www-data
stopasgroup=true

; Laravel scheduler
[program:newznab-scheduler]
command=php /var/www/newznab/artisan schedule:work
directory=/var/www/newznab
autostart=true
autorestart=true
priority=11
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
user=www-data
stopasgroup=true
