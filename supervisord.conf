[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Newznab queue workers - adjust count based on your server resources
[program:newznab-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/newznab/artisan queue:work --queue=default --tries=3 --timeout=3600
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
stopasgroup=true

[program:newznab-worker-releases]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/newznab/artisan queue:work --queue=releases --tries=3 --timeout=3600
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-releases.log
stopasgroup=true

[program:newznab-worker-failed]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/newznab/artisan queue:failed-table
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-failed.log
stopasgroup=true

[program:newznab-scheduler]
command=php /var/www/newznab/artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stopasgroup=true
