version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newznab-app
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - meilisearch
    volumes:
      - ./config/.env:/var/www/newznab/.env:ro
      - app-storage:/var/www/newznab/storage
      - app-cache:/var/www/newznab/bootstrap/cache
      - nzb-store:/var/www/newznab/storage/nzbs
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_MAX_EXECUTION_TIME=300
    networks:
      - newznab-net
    labels:
      - "com.example.description=Newznab-tmux Usenet Indexer"

  nginx:
    image: nginx:alpine
    container_name: newznab-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app-storage:/var/www/newznab/storage:ro
      - nzb-store:/var/www/newznab/storage/nzbs:ro
    networks:
      - newznab-net

  db:
    image: mariadb:latest
    container_name: newznab-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-newznab}
      MYSQL_USER: ${DB_USERNAME:-newznab}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: 'yes'
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - newznab-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: newznab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - newznab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: newznab-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - newznab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      timeout: 3s
      retries: 5

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newznab-supervisor
    restart: unless-stopped
    depends_on:
      - app
      - db
      - redis
    volumes:
      - ./config/.env:/var/www/newznab/.env:ro
      - ./config/supervisord.conf:/etc/supervisord.conf:ro
      - app-storage:/var/www/newznab/storage
      - app-cache:/var/www/newznab/bootstrap/cache
      - nzb-store:/var/www/newznab/storage/nzbs
      - supervisor-logs:/var/log/supervisor
    command: supervisord -c /etc/supervisord.conf
    networks:
      - newznab-net

volumes:
  app-storage:
  app-cache:
  db-data:
  redis-data:
  meilisearch-data:
  nzb-store:
  supervisor-logs:

networks:
  newznab-net:
    driver: bridge
