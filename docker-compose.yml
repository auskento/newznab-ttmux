version: '3.8'

services:
  newznab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newznab-tmux
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Application storage (Usenet headers, metadata, generated files)
      - ${APPDATA_PATH:-.}/storage:/var/www/newznab/storage
      # Bootstrap cache
      - ${APPDATA_PATH:-.}/bootstrap-cache:/var/www/newznab/bootstrap/cache
      # Downloaded NZB files
      - ${APPDATA_PATH:-.}/nzbs:/var/www/newznab/storage/nzbs
      # Application configuration
      - ${APPDATA_PATH:-.}/config:/var/www/newznab/config
      # Database storage
      - ${APPDATA_PATH:-.}/mysql:/data/mysql
      # Redis cache storage
      - ${APPDATA_PATH:-.}/redis:/data/redis
      # Meilisearch index storage
      - ${APPDATA_PATH:-.}/meilisearch:/data/meilisearch
      # Supervisor logs
      - ${APPDATA_PATH:-.}/logs:/var/log/supervisor
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-2048M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-changeme}
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://127.0.0.1:7700
    labels:
      - "com.example.description=Newznab-tmux All-in-One Usenet Indexer"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
