version: '3.8'

services:
  newznab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newznab-tmux
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Application configuration (Laravel .env, app config)
      - ${CONFIG_PATH:-./config}:/config
      # Application storage (Usenet headers, metadata, NZBs, bootstrap cache)
      - ${STORAGE_PATH:-./storage}:/var/www/newznab/storage
      # Bootstrap cache directory
      - ${STORAGE_PATH:-./storage}/bootstrap-cache:/var/www/newznab/bootstrap/cache
      # Database storage
      - ${DATA_PATH:-./data}/mysql:/data/mysql
      # Redis cache storage
      - ${DATA_PATH:-./data}/redis:/data/redis
      # Meilisearch index storage
      - ${DATA_PATH:-./data}/meilisearch:/data/meilisearch
      # Supervisor logs
      - ${DATA_PATH:-./data}/logs:/var/log/supervisor
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-2048M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-changeme}
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://127.0.0.1:7700
    labels:
      - "com.example.description=Newznab-tmux All-in-One Usenet Indexer"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
